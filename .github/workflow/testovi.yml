name: Testovi

on: push

jobs:
  testiranje:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod iz repoa
        uses: actions/checkout@v4

      - name: Instaliraj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instaliraj pytest
        run: pip install pytest

      - name: Pokreni testove
        run: pytest -v
